<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0c0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LA ESTACIÓN GRILL" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="Sistema de control de comandas, cuentas de mesas y KDS de cocina para La Estación Grill." />
    <link rel="preconnect" href="https://idgyotujnoavliaqtuck.supabase.co" />
    <link rel="dns-prefetch" href="https://idgyotujnoavliaqtuck.supabase.co" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>LA ESTACIÓN GRILL | Control de Mesas y Comandas</title>
    <style>
      #pantalla-carga-inicio {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0d0c0a;
        color: #faf6f0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        transition: opacity 0.45s ease-out, visibility 0.45s ease-out;
      }
      #pantalla-carga-inicio.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .contenedor-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
        max-width: 380px;
        width: 90%;
      }
      .emblema-splash {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .aura-fuego-splash {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.45) 0%, rgba(212, 175, 55, 0.15) 50%, transparent 75%);
        filter: blur(12px);
        animation: pulso-fuego 2s infinite alternate ease-in-out;
      }
      .caja-icono-splash {
        position: relative;
        z-index: 2;
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: linear-gradient(135deg, #f59e0b, #d4af37, #b45309);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.5);
        border: 1.5px solid rgba(254, 240, 138, 0.8);
      }
      .icono-flama-svg {
        width: 36px;
        height: 36px;
        color: #1c1917;
      }
      .titulo-splash {
        font-size: 1.5rem;
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #fbbf24;
        margin: 0 0 0.35rem 0;
        text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
      }
      .subtitulo-splash {
        font-size: 0.8rem;
        font-weight: 600;
        color: #a8a29e;
        letter-spacing: 0.05em;
        margin: 0 0 1.75rem 0;
      }
      .barra-exterior-splash {
        width: 100%;
        height: 6px;
        background-color: #292524;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(120, 53, 15, 0.4);
      }
      .barra-interior-splash {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 45%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #b45309, #f59e0b, #fef08a, #f59e0b);
        background-size: 200% 100%;
        animation: barra-flujo 1.4s infinite ease-in-out;
      }
      .texto-estado-splash {
        margin-top: 0.85rem;
        font-size: 0.72rem;
        font-weight: 700;
        color: #78716c;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      @keyframes pulso-fuego {
        0% { transform: scale(0.92); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes barra-flujo {
        0% { left: -45%; }
        50% { left: 40%; }
        100% { left: 105%; }
      }
    </style>
  </head>
  <body class="bg-[#0d0c0a] text-[#faf6f0] select-none">
    <!-- Preloader inicial estático -->
    <div id="pantalla-carga-inicio">
      <div class="contenedor-splash">
        <div class="emblema-splash">
          <div class="aura-fuego-splash"></div>
          <div class="caja-icono-splash">
            <svg class="icono-flama-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
            </svg>
          </div>
        </div>
        <h1 class="titulo-splash">LA ESTACIÓN GRILL</h1>
        <p class="subtitulo-splash">Control de Mesas y Comandas</p>
        <div class="barra-exterior-splash">
          <div class="barra-interior-splash"></div>
        </div>
        <span class="texto-estado-splash" id="etiqueta-estado-splash">Cargando sistema...</span>
      </div>
    </div>

    <div id="root"></div>
    <script>
      // Función global segura para desvanecer y retirar la pantalla de carga
      window.__ocultarPantallaCarga = function() {
        var splash = document.getElementById('pantalla-carga-inicio');
        if (splash && !splash.classList.contains('fade-out')) {
          splash.classList.add('fade-out');
          setTimeout(function() {
            if (splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 500);
        }
      };
      // Fallback de seguridad: retirar tras 4.5 segundos si la app tarda en responder
      setTimeout(window.__ocultarPantallaCarga, 4500);
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
